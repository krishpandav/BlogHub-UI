                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" class="form-control" id="password" name="password" required

                                <div class="invalid-feedback">
                                    Password must be at least 4 characters long.
                                </div>
                            </div>

                            <div class="mb-3 form-check">
                                <input type="checkbox" class="form-check-input" id="rememberMe" name="rememberMe">
                                <label class="form-check-label" for="rememberMe">
                                    Remember me
                                </label>
                            </div>

                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary-custom" id="loginBtn">
                                    <span class="spinner-border spinner-border-sm d-none me-2" id="loginSpinner"></span>
                                    Sign In
                                </button>
                            </div>
                        </form>

                        <div class="text-center mt-4">
                            <p class="mb-0">Don't have an account?
                                <a href="register.html" class="text-decoration-none">Create one here</a>
                            </p>
                        </div>
                    </div>
                </div>

    <!-- Footer -->

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- Custom JS -->
    <script src="assets/js/config.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/api.js"></script>

    <script>
        $(document).ready(function () {
            // Redirect if already authenticated
            if (Auth.redirectIfAuthenticated()) {
                return;
            }

            // Handle form submission
            $('#loginForm').on('submit', function (e) {
                e.preventDefault();
                handleLogin();
            });

            // Handle demo credential buttons
            window.fillDemoUserEmail = function () {
                $('#email').val('user@demo.com');
                $('#password').val('password123');
            };

            window.fillDemoUserUsername = function () {
                $('#email').val('userdemo');
                $('#password').val('password123');
            };

            window.fillDemoAdminEmail = function () {
                $('#email').val('admin@demo.com');
                $('#password').val('admin123');
            };

            window.fillDemoAdminUsername = function () {
                $('#email').val('admindemo');
                $('#password').val('admin123');
            };
        });

        function handleLogin() {
            const form = document.getElementById('loginForm');
            const formData = new FormData(form);

            // Validate form
            if (!form.checkValidity()) {
                form.classList.add('was-validated');
                return;
            }

            // Get form data
            const credentials = {
                username: formData.get('email'),
                password: formData.get('password')
            };

            const rememberMe = formData.get('rememberMe') === 'on';

            // Show loading state
            showLoading(true);
            hideAlerts();

            // Attempt login
            Auth.login(credentials, rememberMe)
                .then(response => {
                    showSuccess('Login successful! Redirecting...');

                    // Redirect after short delay
                    setTimeout(() => {
                        const redirectUrl = UTILS.getUrlParameter('redirect') || 'index.html';
                        window.location.href = redirectUrl;
                    }, 1500);
                })
                .catch(error => {
                    showError(error.message || 'Login failed. Please try again.');
                })
                .finally(() => {
                    showLoading(false);
                });
        }

        function showLoading(show) {
            const $btn = $('#loginBtn');
            const $spinner = $('#loginSpinner');

            if (show) {
                $btn.prop('disabled', true);
                $spinner.removeClass('d-none');
                $btn.text(' Signing In...');
            } else {
                $btn.prop('disabled', false);
                $spinner.addClass('d-none');
                $btn.text('Sign In');
            }
        }

        function showError(message) {
            $('#errorMessage').text(message);
            $('#errorAlert').removeClass('d-none');
            $('#successAlert').addClass('d-none');
        }

        function showSuccess(message) {
            $('#successMessage').text(message);
            $('#successAlert').removeClass('d-none');
            $('#errorAlert').addClass('d-none');
        }

        function hideAlerts() {
            $('#errorAlert').addClass('d-none');
            $('#successAlert').addClass('d-none');
        }
    </script>
</body>
